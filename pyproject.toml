[project]
name = "collie"
version = "0.1.0"
description = "Cost-aware OR-LLM Liaison for Inventory Exceptions: verified ShockSpecs for sparse LLM-OR inventory control"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

# Runtime dependencies. Exact versions are pinned in uv.lock, which is committed;
# the ranges here express intent, the lockfile guarantees reproducibility.
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "scipy>=1.14,<2",
    "pyyaml>=6.0,<7",
    # Required only so the pinned submodule's own scripts (scripts/run_or.py,
    # eval/run_baseline_policy.py) are runnable from OUR venv via PYTHONPATH.
    # We never create a venv inside third_party/.
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Pulled in from Week 2 onward: detectors, gate predictor, classifier, plots, mixed effects.
analysis = [
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "statsmodels>=0.14,<1",
]
# LLM transport. Local open-weight primary via an OpenAI-compatible endpoint.
llm = [
    "openai>=1.50,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1,<7",
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collie"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
# third_party/ is a read-only pinned submodule. Never lint or format it.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "RUF001",  # ambiguous unicode: env.py quotes contain CJK, and we cite it
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: takes more than a few seconds",
    "needs_benchmark: requires the InventoryBench submodule with LFS objects present",
    "needs_llm: requires a reachable OpenAI-compatible endpoint",
    "equivalence: the accounting-equivalence differential suite (Task 4)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["collie"]
omit = ["*/fakes/*"]
