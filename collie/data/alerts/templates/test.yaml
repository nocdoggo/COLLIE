# DEVELOPMENT DRAFT — authored stimuli, not final CP1 approval.
# Each family has 4 accurate, 2 overstated, 2 ambiguous, 2 distractor entries.
# Non-distractor labels follow the supplied foundation fake, not a verified registry.
# PENDING_NO_CHANGE_SIGNATURE is deliberately unregistered; resolve with Module 02.
# Do not treat a successful structural load as signature validation.
# Compound persistence/duration follow the fake labels; check their semantics at integration.
# Texts are synthetic messages, not reports of real events. They need human realism review.
# Slots carry per-episode controlled variation (supplier/location/timing/severity); draws are deterministic per (template_id, seed).
# Do not replace registry validation or real incident/benchmark leakage checks with these drafts.

