[project]
name = "plan-b"
version = "0.1.0"
description = "Plan B: The Show Must Go On. Wave 1 deterministic campus sandbox (fictional, local only)."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# The application has its own dependency boundary, separate from the COLLIE
# research environment at the repository root. Exact versions are in uv.lock.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
]

[project.scripts]
plan-b = "plan_b.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.15,<0.16",
    "mypy>=1.11,<2",
    "jsonschema>=4.23,<5",
]
e2e = [
    "playwright>=1.48,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plan_b"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["plan_b"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
