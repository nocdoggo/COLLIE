<svg xmlns="http://www.w3.org/2000/svg" width="820" height="358" viewBox="0 0 820 358" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Outcome met and status checks, per case and policy</title>
<desc id="dsc">For each case, one bar per policy: on the left the share of recorded episodes that met the case's outcome class (labelled met/recorded), on the right the mean number of status checks per scored episode.</desc>
