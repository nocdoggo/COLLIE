<text class="s" fill="#52514e" x="417" y="43">P2 selective</text>
<rect class="P3" fill="#eda100" x="519" y="34" width="10" height="10" rx="2"/>
<text class="s" fill="#52514e" x="533" y="43">P3 verify-all</text>
<line class="g" stroke="#e4e3df" x1="206.0" y1="70" x2="206.0" y2="208"/>
<text class="s" fill="#52514e" x="206.0" y="224" text-anchor="middle">0%</text>
