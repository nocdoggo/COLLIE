<svg xmlns="http://www.w3.org/2000/svg" width="820" height="238" viewBox="0 0 820 238" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Outcome met and status checks, per case and policy</title>
<desc id="dsc">For each case, one bar per policy: on the left the share of recorded episodes that met the case's outcome class (labelled met/recorded), on the right the mean number of status checks per scored episode.</desc>
<style>svg{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--P0:#2a78d6;--P1:#eb6834;--P2:#1baf7a;--P3:#eda100}@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#383835;--P0:#3987e5;--P1:#d95926;--P2:#199e70;--P3:#c98500}}.bg{fill:var(--bg)}.t{fill:var(--ink);font-size:12px}.s{fill:var(--ink2);font-size:11px}.h{fill:var(--ink);font-size:14px;font-weight:600}.g{stroke:var(--grid);stroke-width:1}.P0{fill:var(--P0)}.P1{fill:var(--P1)}.P2{fill:var(--P2)}.P3{fill:var(--P3)}</style>
<rect class="bg" fill="#fcfcfb" x="0" y="0" width="820" height="238"/>
<text class="h" fill="#0b0b0b" x="206" y="22">Episodes meeting the case outcome</text>
<text class="h" fill="#0b0b0b" x="536" y="22">Status checks per episode (mean)</text>
