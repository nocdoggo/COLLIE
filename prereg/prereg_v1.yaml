metadata:
  version: 1
  draft: false
  status: final thresholds approved 2026-09-22; formal pilot not yet run
  frozen_before_test_runs: true

primary_endpoints:
  - cumulative_undiscounted_profit
  - total_lost_sales_units

stratum_weights:
  family:
    demand_level: 0.3333333333333333
    temporary_pulse: 0.16666666666666666
    lead_time_shift: 0.16666666666666666
    shipment_loss: 0.16666666666666666
    compound: 0.16666666666666666
  information_condition:
    no_alert: 0.25
    early_accurate: 0.25
    late_accurate: 0.25
    unreliable: 0.25
  null_controls:
    silent_null: 0.5
    false_alert_null: 0.5

confirmatory_contrasts:
  - id: arm10_vs_arm1
    treatment: arm10_spec_eprocess
    control: arm1_capped_base_stock
  - id: arm10_vs_arm7
    treatment: arm10_spec_eprocess
    control: arm7_llm_to_or_persistent
  - id: arm10_vs_arm9
    treatment: arm10_spec_eprocess
    control: arm9_spec_heuristic_rollback

holm_family:
  members:
    - id: arm10_vs_arm1:profit
      contrast: arm10_vs_arm1
      endpoint: cumulative_undiscounted_profit
    - id: arm10_vs_arm1:lost_sales
      contrast: arm10_vs_arm1
      endpoint: total_lost_sales_units
    - id: arm10_vs_arm7:profit
      contrast: arm10_vs_arm7
      endpoint: cumulative_undiscounted_profit
    - id: arm10_vs_arm7:lost_sales
      contrast: arm10_vs_arm7
      endpoint: total_lost_sales_units
    - id: arm10_vs_arm9:profit
      contrast: arm10_vs_arm9
      endpoint: cumulative_undiscounted_profit
    - id: arm10_vs_arm9:lost_sales
      contrast: arm10_vs_arm9
      endpoint: total_lost_sales_units

alpha_allocation:
  episode_alpha: 0.05
  proposal_split: alpha_j = alpha * 2^-j
  max_proposals: 2

trigger_thresholds:
  source: collie.trigger.calibration.FROZEN, dev/cal null episodes only
  mu0: 100.0
  sigma0: 25.0
  cusum_k: 0.5
  cusum_h: 5.18
  page_hinkley_delta: 12.5
  page_hinkley_threshold: 129.5
  refractory_window: 5
  max_proposals: 2
  primary_rule: alert_or_detector

controller_grid:
  source: collie.control.grid
  demand_multipliers: [0.6, 0.75, 1.0, 1.25, 1.5, 2.0]
  effective_lead_times: [1, 2, 3, 4]
  pipeline_credit_weights: [0.0, 0.5, 1.0]
  baseline:
    m: 1.0
    l_eff: 1
    gamma: 1.0
    predictive_model: stationary
  config_count: 72
  order_cap_source: EpisodeSpec.order_cap
  labelled_as_ours: true

compiler_mapping_table:
  source: collie.control.mapping.CANONICAL_SHAPES via compile_spec
  tier: semantic_core
  entries:
    - family: compound
      direction: mixed
      target_stream: both
      by_magnitude:
        low: {m: 1.25, l_eff: 2, gamma: 1.0, predictive_model: compound_demand_up_lead_time_delay}
        medium: {m: 1.25, l_eff: 2, gamma: 1.0, predictive_model: compound_demand_up_lead_time_delay}
        high: {m: 1.5, l_eff: 3, gamma: 1.0, predictive_model: compound_demand_up_lead_time_delay}
    - family: demand_level
      direction: demand_down
      target_stream: demand
      by_magnitude:
        low: {m: 0.75, l_eff: 1, gamma: 1.0, predictive_model: demand_down}
        medium: {m: 0.6, l_eff: 1, gamma: 1.0, predictive_model: demand_down}
        high: {m: 0.6, l_eff: 1, gamma: 1.0, predictive_model: demand_down}
    - family: demand_level
      direction: demand_up
      target_stream: demand
      by_magnitude:
        low: {m: 1.25, l_eff: 1, gamma: 1.0, predictive_model: demand_up}
        medium: {m: 1.5, l_eff: 1, gamma: 1.0, predictive_model: demand_up}
        high: {m: 2.0, l_eff: 1, gamma: 1.0, predictive_model: demand_up}
    - family: lead_time_shift
      direction: arrival_delayed
      target_stream: arrival
      by_magnitude:
        low: {m: 1.0, l_eff: 2, gamma: 1.0, predictive_model: lead_time_delay}
        medium: {m: 1.0, l_eff: 3, gamma: 1.0, predictive_model: lead_time_delay}
        high: {m: 1.0, l_eff: 4, gamma: 1.0, predictive_model: lead_time_delay}
    - family: shipment_loss
      direction: arrival_interrupted
      target_stream: arrival
      by_magnitude:
        low: {m: 1.0, l_eff: 1, gamma: 0.5, predictive_model: shipment_loss}
        medium: {m: 1.0, l_eff: 1, gamma: 0.0, predictive_model: shipment_loss}
        high: {m: 1.0, l_eff: 1, gamma: 0.0, predictive_model: shipment_loss}
    - family: temporary_pulse
      direction: demand_down
      target_stream: demand
      by_magnitude:
        low: {m: 0.75, l_eff: 1, gamma: 1.0, predictive_model: demand_down}
        medium: {m: 0.6, l_eff: 1, gamma: 1.0, predictive_model: demand_down}
        high: {m: 0.6, l_eff: 1, gamma: 1.0, predictive_model: demand_down}
    - family: temporary_pulse
      direction: demand_up
      target_stream: demand
      by_magnitude:
        low: {m: 1.25, l_eff: 1, gamma: 1.0, predictive_model: demand_up}
        medium: {m: 1.5, l_eff: 1, gamma: 1.0, predictive_model: demand_up}
        high: {m: 2.0, l_eff: 1, gamma: 1.0, predictive_model: demand_up}
    - family: transit_pause
      direction: arrival_interrupted
      target_stream: arrival
      by_magnitude:
        low: {m: 1.0, l_eff: 2, gamma: 1.0, predictive_model: lead_time_delay}
        medium: {m: 1.0, l_eff: 2, gamma: 1.0, predictive_model: lead_time_delay}
        high: {m: 1.0, l_eff: 3, gamma: 0.5, predictive_model: transit_stall}

schema_thresholds:
  source: collie.spec.schema, collie.spec.registry, collie.verify.registry
  minimum_evidence_refs: 0
  onset_windows:
    - [-2, 0]
    - [-1, 1]
    - [0, 2]
    - [-2, 2]
  signatures:
    - sig_demand_level_up
    - sig_demand_level_down
    - sig_demand_pulse
    - sig_arrival_delay
    - sig_arrival_loss
    - sig_arrival_stall
    - sig_compound
  trust_region_overlap: registered_family_signature_and_onset_intersection

oracle_mappings:
  source: collie.verify.registry.CONSTRUCTIONS
  entries:
    - predictive_model: demand_level_up
      family: demand_level
      signature: sig_demand_level_up
      stream: demand
      direction: demand_up
      construction: discrete_mixture_lr
      validity: anytime_valid
    - predictive_model: demand_level_down
      family: demand_level
      signature: sig_demand_level_down
      stream: demand
      direction: demand_down
      construction: discrete_mixture_lr
      validity: anytime_valid
    - predictive_model: demand_pulse
      family: temporary_pulse
      signature: sig_demand_pulse
      stream: demand
      direction: demand_up
      construction: bounded_duration_mixture_lr
      validity: anytime_valid_low_power
    - predictive_model: arrival_delay
      family: lead_time_shift
      signature: sig_arrival_delay
      stream: arrival
      direction: arrival_delayed
      construction: finite_state_forward
      validity: collie_shockspec_only
    - predictive_model: arrival_loss
      family: shipment_loss
      signature: sig_arrival_loss
      stream: arrival
      direction: arrival_interrupted
      construction: finite_state_forward_absorbing_loss
      validity: collie_shockspec_only
    - predictive_model: arrival_stall
      family: transit_pause
      signature: sig_arrival_stall
      stream: arrival
      direction: arrival_interrupted
      construction: finite_state_forward_frozen_counters
      validity: collie_shockspec_only
    - predictive_model: compound_split
      family: compound
      signature: sig_compound
      stream: both
      direction: mixed
      construction: separate_eprocesses_alpha_split
      validity: anytime_valid_via_splitting

trust_region:
  source: collie.spec.registry and collie.verify.registry
  definition: proposals must use a registered family/signature pair, target stream, direction, and onset window before verifier construction is selected

power_rule:
  function: collie.data.splits.required_confirmatory_seeds
  calibration_only: true
  alpha: 0.05
  power: 0.8

pilot_policy:
  independent_units: 120
  call_budget_per_episode: 4
  episode_horizon: 50
  never_recovered_value: 51
  recovery_reference: final shock-active period
  formal_go_uses_confidence_bound: true
  headroom_definition: count of shock families where oracle raw-profit lift is at least 5 percent or CVaR10 lift is at least 10 percent
  detector_definition: arm10 minus detector-to-compiler control on cumulative undiscounted profit

go_criteria:
  - id: profit_lift
    threshold: 0.0
    operator: ">="
    definition: arm10 minus arm1 cumulative undiscounted profit
  - id: lost_sales_reduction
    threshold: 0.0
    operator: ">="
    definition: arm1 minus arm10 total lost-sales units
  - id: false_activation_control
    threshold: 0.95
    operator: ">="
    definition: one minus arm10 episode-level activation rate under registered global nulls
  - id: wrong_family_exposure
    threshold: 0.10
    operator: "<="
    definition: mean fraction of periods carrying an active wrong-family specification
  - id: fill_rate_floor
    threshold: 0.95
    operator: ">="
    definition: mean arm10 fill rate
  - id: cost_frontier
    threshold: 1.0
    operator: ">="
    definition: indicator that arm10 lies on the realised profit-cost Pareto frontier
  - id: recovery_time
    threshold: 4.0
    operator: "<="
    definition: periods after the final shock-active period to the first of three consecutive periods with fill rate at least 0.95

kill_thresholds:
  insufficient_headroom: 3
  detector_indistinguishable: 0.0
  false_activation_rate: 0.10
  wrong_family_activation_rate: 0.25
  parser_failure_rate: 0.10
  budget_overrun_rate: 0.10
  negative_profit_lift: 0.0

kill_triggers:
  - id: insufficient_headroom
    threshold: insufficient_headroom
    operator: "<="
  - id: detector_indistinguishable
    threshold: detector_indistinguishable
    operator: "<="
  - id: false_activation_rate
    threshold: false_activation_rate
    operator: ">="
  - id: wrong_family_activation_rate
    threshold: wrong_family_activation_rate
    operator: ">="
  - id: parser_failure_rate
    threshold: parser_failure_rate
    operator: ">="
  - id: budget_overrun_rate
    threshold: budget_overrun_rate
    operator: ">="
  - id: negative_profit_lift
    threshold: negative_profit_lift
    operator: "<="
  - id: method_freeze_or_quarantine_violation
    threshold: none
    operator: "=="
